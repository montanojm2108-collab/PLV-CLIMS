<app-page-header title="Dashboard"></app-page-header>
<ion-content><main class="page-wrap student-page student-dashboard">
  <div class="search-field dashboard-search"><ion-icon name="search-outline" aria-hidden="true"></ion-icon><input [(ngModel)]="query" placeholder="Search room, functionality" aria-label="Search laboratories"></div>
  <div class="lab-stats" aria-label="Laboratory summary">
    <div class="lab-stat available-stat"><span class="stat-icon"><ion-icon name="business-outline" aria-hidden="true"></ion-icon></span><span><strong>{{availableLabs}}</strong><small>Available Labs</small></span></div>
    <div class="lab-stat working-stat"><span class="stat-icon"><ion-icon name="desktop-outline" aria-hidden="true"></ion-icon></span><span><strong>{{working}}</strong><small>Working PCs</small></span></div>
    <div class="lab-stat unavailable-stat"><span class="stat-icon"><ion-icon name="construct-outline" aria-hidden="true"></ion-icon></span><span><strong>{{unavailable}}</strong><small>Non-working PCs</small></span></div>
  </div>
  <div class="dashboard-columns">
    <section class="dashboard-panel"><div class="panel-heading"><h2>Laboratory Overview</h2><button class="text-action" (click)="go('/student/laboratories')">View all &rsaquo;</button></div>
      <button class="overview-lab" type="button" *ngFor="let lab of labs" (click)="go('/student/laboratories/'+lab.id)"><span class="computer-icon"><ion-icon name="desktop-outline" aria-hidden="true"></ion-icon></span><span class="overview-lab-details"><strong>{{lab.name}}</strong><small>{{lab.building}} &middot; {{lab.room}}</small></span><span class="lab-summary"><span class="working-pcs">{{workingCount(lab.id)}} working PCs <span aria-hidden="true">&rsaquo;</span></span><small class="lab-availability" [class.unavailable]="status(lab)==='Unavailable'" [class.in-use]="status(lab)==='In Use'">{{status(lab)}}</small></span></button>
      <p class="empty" *ngIf="!labs.length">No laboratories match your search.</p>
    </section>
    <section class="dashboard-panel"><h2>Announcements</h2><div class="dashboard-notice" *ngFor="let a of announcements"><span class="notice-date">{{a.date | date:'MMM d'}}</span><strong>{{a.title}}</strong><span>{{a.body}}</span></div><p class="empty" *ngIf="!announcements.length">No announcements yet.</p><button class="text-action" (click)="go('/announcements')">View all &rsaquo;</button></section>
  </div>
</main></ion-content>
